<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For You</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #fef5f7 0%, #fde8ed 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }

        .container {
            text-align: center;
            max-width: 500px;
            padding: 40px 20px;
            animation: fadeIn 1.2s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .heart-icon {
            font-size: 60px;
            margin-bottom: 20px;
            animation: beat 1.5s infinite;
        }

        @keyframes beat {

            0%,
            100% {
                transform: scale(1);
            }

            25% {
                transform: scale(1.15);
            }

            50% {
                transform: scale(1);
            }
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 48px;
            color: #d63384;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .subtitle {
            font-size: 16px;
            color: #8b5a6c;
            line-height: 1.8;
            margin-bottom: 40px;
            font-weight: 300;
            letter-spacing: 0.5px;
        }

        .cta-button {
            display: inline-block;
            padding: 14px 40px;
            background: linear-gradient(45deg, #ff4757, #ff6b81);
            color: white;
            text-decoration: none;
            border-radius: 30px;
            font-weight: 600;
            font-size: 15px;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(255, 71, 87, 0.3);
            border: none;
            cursor: pointer;
        }

        .cta-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 28px rgba(255, 71, 87, 0.4);
        }

        .cta-button:active {
            transform: translateY(-1px);
        }

        .decorative-line {
            width: 60px;
            height: 2px;
            background: #ff6b81;
            margin: 30px auto;
            opacity: 0.6;
        }

        .footer-text {
            font-size: 12px;
            color: #b8a0a8;
            margin-top: 50px;
            font-weight: 300;
        }

        /* Floating particles */
        .particle {
            position: fixed;
            pointer-events: none;
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 36px;
            }

            .subtitle {
                font-size: 14px;
            }

            .heart-icon {
                font-size: 48px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="heart-icon">💖</div>
        <h1>For You</h1>

        <div class="decorative-line"></div>

        <p class="subtitle">
            Ada sesuatu yang spesial menunggu. Buka hadiah ultahmu dan rasakan pesan istimewa ini.
        </p>

        <a href="HBD KIDOOO/index.html" class="cta-button">Buka Hadiah 🎁</a>

        <p class="footer-text">~ Dibuat dengan cinta ~</p>
    </div>

    <script>
        // Floating particles effect
        function createParticle() {
            const particle = document.createElement('div');
            particle.className = 'particle';
            particle.innerHTML = '✨';
            particle.style.left = Math.random() * window.innerWidth + 'px';
            particle.style.top = '-10px';
            particle.style.fontSize = (Math.random() * 10 + 8) + 'px';
            particle.style.opacity = Math.random() * 0.5 + 0.3;

            document.body.appendChild(particle);

            let top = -10;
            const speed = Math.random() * 1 + 0.5;
            const drift = (Math.random() - 0.5) * 2;

            const interval = setInterval(() => {
                top += speed;
                particle.style.top = top + 'px';
                particle.style.left = parseFloat(particle.style.left) + drift + 'px';

                if (top > window.innerHeight) {
                    clearInterval(interval);
                    particle.remove();
                }
            }, 30);
        }

        setInterval(createParticle, 800);
    </script>
</body>

</html>
